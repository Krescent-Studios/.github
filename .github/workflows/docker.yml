name: Deployment

on:
  workflow_call:
    inputs:
      PORTAINER:
        required: false
        type: boolean
      URL:
        required: false
        type: string
      DOCKER_TARGET:
        required: false
        type: string
      IMAGE_SUFFIX:
        description: "Appended to the image name, e.g. -api. Empty for single-image repos."
        required: false
        type: string
      DEPLOY_TAG:
        required: false
        type: string
        default: "TAG"
    secrets:
      PORTAINER_WEBHOOK:
        description: "The GitOps Stack URL to call after build."
        required: false
      SENTRY_AUTH_TOKEN:
        description: "The sentry organization token to upload sourcemaps with."
        required: false
    outputs:
      version:
        description: "Resolved version"
        value: ${{ jobs.build.outputs.version }}
      commit_sha:
        description: "Commit SHA"
        value: ${{ jobs.build.outputs.commit_sha }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit_sha: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ inputs.IMAGE_SUFFIX }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.DOCKER_TARGET }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}
            COMMIT_SHA=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            API_URL=${{ vars.API_URL }}
          secrets: |
            SHA=${{ github.sha }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            PATHOS_OPENAPI_SECRET=${{ secrets.PATHOS_OPENAPI_SECRET }}
          cache-from: type=gha,scope=${{ github.repository }}${{ inputs.IMAGE_SUFFIX }}-docker
          cache-to: type=gha,mode=max,scope=${{ github.repository }}${{ inputs.IMAGE_SUFFIX }}-docker

      - name: Check for build-output stage
        id: check_build_output_stage
        run: |
          if [ -f Dockerfile ] && grep -qiE '^FROM .+ as build-output' Dockerfile; then
            echo "has_build_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build_output=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export build output
        if: steps.check_build_output_stage.outputs.has_build_output == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build-output
          outputs: type=local,dest=./build-output
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.repository }}${{ inputs.IMAGE_SUFFIX }}-docker

      - name: Upload dist artifact
        # ensure we only upload when the build-output exists and contains files
        if: ${{ steps.check_build_output_stage.outputs.has_build_output == 'true' && hashFiles('build-output/dist/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          # upload the contents so artifact root is the files, not a nested 'dist' folder
          path: ./build-output/dist/*

  request-update:
    if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && needs.build.result == 'success' && inputs.PORTAINER }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production
      url: ${{ inputs.URL }}
    concurrency: production

    steps:
      - name: Call Webhook
        uses: newarifrh/portainer-service-webhook@v1
        with:
          webhook_url: ${{ secrets.PORTAINER_WEBHOOK }}?${{ inputs.DEPLOY_TAG }}=${{ needs.build.outputs.version }}
