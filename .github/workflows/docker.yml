name: Deployment

on:
  workflow_call:
    inputs:
      PORTAINER:
        required: false
        type: boolean
      URL:
        required: false
        type: string
      DOCKER_TARGET:
        required: false
        type: string
      DEPLOY_TAG:
        required: false
        type: string
        default: "TAG"
    secrets:
      PORTAINER_WEBHOOK:
        description: "The GitOps Stack URL to call after build."
        required: false
      SENTRY_AUTH_TOKEN:
        description: "The sentry organization token to upload sourcemaps with."
        required: false
    outputs:
      version:
        description: "Resolved version"
        value: ${{ jobs.build.outputs.version }}
      commit_sha:
        description: "Commit SHA"
        value: ${{ jobs.build.outputs.commit_sha }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit_sha: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.DOCKER_TARGET }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}
            COMMIT_SHA=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
          secrets: |
            SHA=${{ github.sha }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: |
            type=gha,scope=runner
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          cache-to: |
            type=gha,mode=max,scope=runner
            type=inline

      - name: Export build output
        if: ${{ !hashFiles('build-output/**') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build-output
          outputs: type=local,dest=./build-output
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=runner
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Upload dist artifact
        if: ${{ hashFiles('build-output/dist/**') }}
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: ./build-output/dist

  request-update:
    if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && needs.build.result == 'success' && inputs.PORTAINER }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production
      url: ${{ inputs.URL }}
    concurrency: production

    steps:
      - name: Call Webhook
        uses: newarifrh/portainer-service-webhook@v1
        with:
          webhook_url: ${{ secrets.PORTAINER_WEBHOOK }}?${{ inputs.DEPLOY_TAG }}=${{ needs.build.outputs.version }}